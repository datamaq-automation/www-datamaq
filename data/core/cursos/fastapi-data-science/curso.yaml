id: "curso-fastapi-data-science"
slug: "fastapi-data-science"
title: "Construyendo Aplicaciones de Ciencia de Datos con FastAPI"
description_short: "Desarrollá, gestioná y desplegá aplicaciones eficientes de machine learning con Python."
description_long: "Este curso práctico, basado en el libro 'Building Data Science Applications with FastAPI', te guiará en el desarrollo de APIs robustas de machine learning utilizando Python, FastAPI y Pydantic, cubriendo desde la configuración inicial hasta el despliegue en producción y el procesamiento en tiempo real. Prerrequisitos recomendados: conocimientos básicos de Python, manejo de entornos virtuales (venv/pyenv) y conceptos generales de HTTP."
duration: "45 horas de cursada"
level: "Avanzado"
price: 0.0
og_image: "/static/media/cursos/og-fastapi-data-science.webp"
og_image_width: 1103
og_image_height: 1360
instructor_id: "agustin-bustos"
