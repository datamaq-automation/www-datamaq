assistance_modes:
  on_site:
    description: "Relevamiento e intervención directa en tu planta, tablero o línea de proceso."
    icon: "geo-alt-fill"
    label: "Visitas técnicas en campo"
  remote:
    description: "Consultoría, diagnóstico y seguimiento técnico a distancia según el caso."
    icon: "wifi"
    label: "Asistencia remota y consultoría"
services:
  cards:
    - description: "Diagnóstico, reparación y mantenimiento preventivo en celdas MT 13.2/33 kV, tableros CCM, UPS y sistemas de distribución en yacimiento. Protocolo LOTO y normativa NFPA 70E."
      id: "mt-bt-maintenance"
      key_points:
        - "Celdas MT 13.2/33 kV — maniobras de corte y acoplamiento, megado/hipot, pruebas de aislación"
        - "Tableros CCM, UPS industriales y bancos de baterías"
        - "Cumplimiento de Res. SRT 3068/14 para trabajos con riesgo eléctrico"
      modality: "on_site"
      title: "Mantenimiento Eléctrico en Yacimiento (MT/BT)"
    - description: "Parametrización, diagnóstico y puesta en marcha de variadores de frecuencia en bombas de extracción, compresores y sistemas de inyección. Integración con sistemas de control existentes."
      id: "vfd-automation"
      key_points:
        - "Siemens Sinamics, Schneider Altivar, Danfoss — diagnóstico con software Starter y Drive Composer"
        - "Análisis de armónicas y corrección de lazos de corriente"
        - "Telemetría Modbus RTU/TCP para monitoreo continuo de Hz, A, kW y temperatura IGBT"
      modality: "both"
      title: "Variadores de Frecuencia (VFD) y Automatización"
    - description: "Mantenimiento preventivo y correctivo de electrógenos, UPS y sistemas de respaldo para facilities críticas. Transferencia automática y bancos de baterías."
      id: "generators-ups"
      key_points:
        - "Electrógenos — diagnóstico, mantenimiento preventivo y correctivo"
        - "UPS industriales y sistemas de transferencia automática (ATS)"
        - "Bancos de baterías — pruebas de capacidad y autonomía"
      modality: "on_site"
      title: "Electrógenos, UPS y Sistemas de Respaldo"
    - description: "Medición IoT de eficiencia energética, auditoría ISO 50001, factor de potencia y telemetría de variables operativas. El diferenciador técnico que ningún otro contratista de Vaca Muerta ofrece."
      id: "energy-iot"
      key_points:
        - "Medición de kWh, potencia, factor de potencia y distorsión armónica en tiempo real"
        - "Auditoría energética ISO 50001 y análisis de curva de carga"
        - "Dashboards de monitoreo, integración con SCADA y reportes automáticos"
      modality: "both"
      title: "Eficiencia Energética e IoT Industrial"
  title: "Servicios de mantenimiento eléctrico industrial para Oil & Gas"
