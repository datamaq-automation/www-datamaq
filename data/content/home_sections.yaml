    - href: "#proceso"
      label: "Proceso"
    - href: "#tarifas"
      label: "Alcance"
    - href: "#cobertura"
      label: "Cobertura"
    - href: "#faq"
      label: "FAQ"
    - href: "#contacto"
      label: "Contacto"
profile:
  bullets:
    - "Relevamiento en sitio y criterio de implementación."
    - "Instalación, integración y puesta en marcha para captura automática de datos."
    - "Asesoramiento y capacitaciones sobre Python, datos, bases de datos y APIs en contextos reales."
assistance_modes:
  on_site:
    description: "Relevamiento e intervención directa en tu planta, tablero o línea de proceso."
    icon: "geo-alt-fill"
    label: "Visitas técnicas en campo"
  remote:
    description: "Consultoría, diagnóstico y seguimiento técnico a distancia según el caso."
    icon: "wifi"
    label: "Asistencia remota y consultoría"
services:
  cards:
    - description: "Asistencia técnica en planta para relevar, montar, configurar y poner en marcha equipos IoT que midan variables eléctricas y operativas en tableros, líneas o puntos definidos."
      id: "iot-installation"
      key_points:
        - "Medición de kWh, potencia, factor de potencia y distorsión armónica"
        - "Captura de kilos, unidades, metros, velocidades o estados"
        - "Integración inicial con Powermate o sistemas de terceros"
      modality: "on_site"
      title: "Instalación de equipos IoT en campo"
    - description: "Asistencia técnica remota para estructurar, interpretar y explotar datos ya capturados, con foco en seguimiento operativo, diagnóstico y criterio de decisión."
      id: "data-advisory"
      key_points:
        - "Análisis de consumo energético y comportamiento operativo"
        - "Ordenamiento de datos desde bases, planillas, APIs o sistemas existentes"
        - "Soporte para reportes, dashboards y automatizaciones de seguimiento"
      modality: "remote"
      title: "Asesoramiento técnico remoto"
    - description: "Capacitaciones técnicas de cortesía orientadas a equipos que trabajan con datos operativos, Python, bases de datos, APIs o integraciones sobre casos reales. No son el servicio principal: complementan la asistencia."
      id: "training"
      key_points:
        - "Python aplicado con NumPy, pandas y Matplotlib"
        - "Buenas prácticas para trabajar con bases de datos y APIs"
        - "Capacitación adaptada al nivel técnico y al caso real del equipo"
      modality: "both"
      title: "Capacitaciones técnicas de cortesía"
  title: "Servicios técnicos sobre captura, integración y uso de datos"
contact:
  title: "Solicitá asistencia técnica híbrida"
  subtitle: "Contanos tu caso y te proponemos visita en campo o consultoría remota, según la complejidad y tu ubicación. Las capacitaciones técnicas son de cortesía para quienes trabajan con nosotros."
  cta: "Continuá"
  alt_email:
    label: "Contacto alternativo"
    title: "Escribinos por e-mail"
    email: "info@datamaq.com.ar"
  progress_text: "Paso 1 de 3"
  privacy_note: "Guardamos un borrador temporal de este formulario por hasta 12 horas en este dispositivo."
  error_message: "Servicio temporalmente no disponible."
  optional_text: "Opcional"
  steps:
    - title: "Identidad"
      fields:
        - id: "contacto-nombre"
          label: "Nombre"
          autocomplete: "given-name"
        - id: "contacto-apellido"
          label: "Apellido"
          autocomplete: "family-name"
    - title: "Proyecto"
      fields:
        - id: "contacto-modalidad"
          label: "Modalidad de asistencia preferida"
          type: "select"
          options:
            - value: "campo"
              label: "Visita técnica en campo"
            - value: "remoto"
              label: "Asistencia remota / consultoría"
            - value: "ambas"
              label: "Ambas según necesidad"
        - id: "contacto-comentario"
          label: "¿En qué consiste tu proyecto o consulta?"
          type: "textarea"
    - title: "Contacto"
      fields:
        - id: "contacto-email"
          label: "Email"
          autocomplete: "email"
        - id: "contacto-telefono"
          label: "Teléfono"
          autocomplete: "tel"
