about:
  image:
    alt: "Agustin Bustos, técnico a cargo de la implementación de equipos IoT"
    height: 933
    src: "/static/media/tecnico-a-cargo.webp"
    width: 700
  paragraphs:
    - "DataMaq trabaja sobre captura automática de datos operativos, con foco en energía eléctrica, producción y variables críticas de seguimiento."
    - "El servicio combina relevamiento en campo, implementación técnica, integración inicial y acompañamiento para que los datos capturados puedan usarse con criterio en análisis, seguimiento o capacitación."
  title: "Sobre DataMaq"
faq:
  questions:
    - answer: "Según el caso, variables eléctricas como kWh, potencia, factor de potencia y distorsión armónica, o variables operativas como kilos, unidades, metros, velocidades y estados."
      question: "¿Qué tipo de datos se pueden capturar?"
    - answer: "No. La energía es una de las aplicaciones principales, pero también se pueden implementar soluciones para captura de datos de producción u otras variables operativas relevantes."
      question: "¿Trabajás solo con energía eléctrica?"
    - answer: "Sí. Según el proyecto, la solución puede apoyarse en Powermeter para medición eléctrica y en Automate para captura e integración de señales y datos operativos."
      question: "¿Usás Powermeter y Automate?"
hero:
  badge: "Asistencia técnica híbrida: visitas en campo + remota"
  benefits:
    - text: "Relevamiento en planta, instalación de equipos IoT y puesta en marcha según el alcance acordado."
      title: "Visitas técnicas en campo"
    - text: "Consultoría, diagnóstico y seguimiento a distancia para casos que no requieran presencia física."
      title: "Asistencia remota"
    - text: "Capacitaciones técnicas de cortesía orientadas a equipos que trabajan con datos operativos, IoT industrial y Python."
      title: "Formación complementaria"
  image:
    alt: "Captura e integración de datos energéticos y operativos en entorno industrial"
    height: 700
    src: "/static/media/hero-energy.svg"
    width: 900
  primaryCta:
    href: "https://wa.me/5491156297160"
    label: "Escribime por WhatsApp"
  responseNote: "Base operativa: Garín (GBA Norte). Atención en campo según zona y disponibilidad; también asistencia remota para consultoría y seguimiento."
  secondaryCta:
    href: "#servicios"
    label: "Ver alcance técnico"
  subtitle: "Brindamos asistencia técnica para monitoreo de energía industrial, captura de datos operativos e IoT industrial. Visitas en campo y consultoría remota, con capacitaciones técnicas de cortesía según el proyecto."
  title: "Asistencia técnica en monitoreo de energía industrial y datos operativos"
legal:
  text: "La información publicada es referencial y puede actualizarse según alcance, tablero, señales disponibles, conectividad, sistema destino y condiciones de implementación."
