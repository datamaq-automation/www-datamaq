about:
  image:
    alt: "Agustin Bustos, técnico a cargo de la implementación de equipos IoT"
    height: 933
    src: "/static/media/tecnico-a-cargo.webp"
    width: 700
  paragraphs:
    - "Contratista de mantenimiento eléctrico industrial con más de 15 años de experiencia en plantas de proceso continuo. Ex-Tenaris Siderca (Grupo Techint) — Laboratorio de Electrónica en planta Campana."
    - "Docente universitario UTN — cátedras de Mantenimiento Industrial, Electrotecnia, Instalaciones y Máquinas Eléctricas. ITBA · Posgrado en Gestión de la Innovación y Eficiencia Energética."
  title: "Sobre el técnico a cargo"
faq:
  questions:
    - answer: "Sí, facturación directa como monotributista (Factura C). Se trabaja con órdenes de compra o factura directa según lo que necesite tu empresa."
      question: "¿Facturás como monotributista? ¿Aceptás órdenes de compra?"
    - answer: "Sí. Disponibilidad inmediata para regímenes 14x7, 10x5 o 7x7 con pernocte en Añelo. Vehículo propio. Licencia B.1 4x4 en trámite activo."
      question: "¿Tenés disponibilidad para régimen rotativo en yacimiento?"
    - answer: "Celdas MT 13.2/33 kV. Maniobras de corte y acoplamiento, megado/hipot, pruebas de aislación. Conocimiento de Res. SRT 3068/14."
      question: "¿Qué equipos de Media Tensión manejás?"
    - answer: "Base operativa en Garín (GBA Norte). Disponibilidad para cambiar residencia a Neuquén. Asistencia en campo en Añelo, La Calera, Parque Industrial Neuquén y toda la Cuenca Neuquina."
      question: "¿Dónde estás ubicado?"
    - answer: "Sí. Experiencia comprobable en laboratorio de electrónica de Tenaris Siderca (Grupo Techint) en planta Campana. 15 años en plantas de proceso continuo."
      question: "¿Tenés experiencia en plantas de Oil & Gas?"
