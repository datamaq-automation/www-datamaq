profile:
  bullets:
    - "Relevamiento técnico en planta y diseño de arquitectura de telemetría IoT a medida."
    - "Instalación, integración y puesta en marcha para captura automática y continua de datos energéticos y productivos."
    - "Consultoría informática y capacitaciones profesionales en Python, bases de datos y APIs para optimización operativa."
assistance_modes:
  on_site:
    description: "Relevamiento e intervención directa en tu planta, tablero o línea de proceso."
    icon: "geo-alt-fill"
    label: "Visitas técnicas en campo"
  remote:
    description: "Consultoría, diagnóstico y seguimiento técnico a distancia según el caso."
    icon: "wifi"
    label: "Asistencia remota y consultoría"
services:
  cards:
    - description: "Servicios de instalación de maquinaria y equipos industriales de medición. Realizamos el relevamiento, montaje físico y puesta en marcha de dispositivos IoT en tableros y líneas de proceso."
      id: "iot-installation"
      key_points:
        - "Medición de kWh, potencia, factor de potencia y distorsión armónica"
        - "Instalación y configuración de Powermeter e instrumentación IoT en campo"
        - "Captura de variables operativas físicas (kilos, unidades, metros, estados)"
      modality: "on_site"
      title: "Instalación de equipos industriales IoT"
    - description: "Servicios de consultoría informática y suministro de programas a medida para estructurar, integrar y explotar tus datos operativos y bases de datos históricas."
      id: "data-advisory"
      key_points:
        - "Desarrollo de software y scripts personalizados (Python, APIs, bases de datos)"
        - "Estructuración de datos operativos y diseño de dashboards de monitoreo"
        - "Soporte remoto para el análisis de comportamiento operativo y energético"
      modality: "remote"
      title: "Consultoría informática y de datos"
    - description: "Relevamiento, integración industrial Modbus e instalación de equipos IoT para la captura remota de datos en variadores de frecuencia (VFD). Monitoreo en tiempo real de velocidad, corriente, torque y diagnóstico preventivo."
      id: "vfd-telemetry"
      key_points:
        - "Lectura continua de Hz, Amperes, kW acumulados y temperatura de etapa de potencia"
        - "Integración de comunicación industrial vía Modbus RTU/TCP con gateways IoT"
        - "Análisis de eficiencia energética y prevención de fallas por sobrecarga en motores"
      modality: "both"
      title: "Telemetría e integración de variadores de velocidad"
    - description: "Capacitaciones técnicas profesionales orientadas a transferir conocimientos a equipos de trabajo sobre herramientas informáticas, Python y análisis de datos. Complementan nuestro servicio de consultoría."
      id: "training"
      key_points:
        - "Python aplicado con NumPy, pandas y visualización de datos"
        - "Buenas prácticas en integración de APIs y bases de datos relacionales"
        - "Transferencia de conocimiento adaptada a la realidad del equipo técnico"
      modality: "both"
      title: "Capacitaciones profesionales complementarias"
  title: "Servicios profesionales de consultoría, instalación y análisis de datos"
contact:
  title: "Solicitá asistencia técnica híbrida"
  subtitle: "Contanos tu caso y te proponemos visita en campo o consultoría remota, según la complejidad y tu ubicación. Las capacitaciones técnicas son de cortesía para quienes trabajan con nosotros."
  cta: "Continuá"
  alt_email:
    label: "Contacto alternativo"
    title: "Escribinos por e-mail"
    email: "info@datamaq.com.ar"
  progress_text: "Paso 1 de 3"
  privacy_note: "Guardamos un borrador temporal de este formulario por hasta 12 horas en este dispositivo."
  error_message: "Servicio temporalmente no disponible."
  optional_text: "Opcional"
  steps:
    - title: "Identidad"
      fields:
        - id: "contacto-nombre"
          label: "Nombre"
          autocomplete: "given-name"
        - id: "contacto-apellido"
          label: "Apellido"
          autocomplete: "family-name"
    - title: "Proyecto"
      fields:
        - id: "contacto-modalidad"
          label: "Modalidad de asistencia preferida"
          type: "select"
          options:
            - value: "campo"
              label: "Visita técnica en campo"
            - value: "remoto"
              label: "Asistencia remota / consultoría"
            - value: "ambas"
              label: "Ambas según necesidad"
        - id: "contacto-comentario"
          label: "¿En qué consiste tu proyecto o consulta?"
          type: "textarea"
    - title: "Contacto"
      fields:
        - id: "contacto-email"
          label: "Email"
          autocomplete: "email"
        - id: "contacto-telefono"
          label: "Teléfono"
          autocomplete: "tel"
