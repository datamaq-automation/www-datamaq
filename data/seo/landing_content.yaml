industrias:
  grafica:
    title: "Soluciones para la Industria Gráfica"
    paragraphs:
      - "La industria gráfica consume energía en prensas, termofijadoras, cizallas, sistemas de climatización e iluminación. Medir el consumo por máquina y turno permite identificar desperdicios, planificar mantenimiento y mejorar la cotización de trabajos."
      - "Trabajamos con talleres e imprentas para instalar medidores IoT, leer variables operativas y conectar los datos a una primera capa de visualización o reporte."
    bullets:
      - "Medición de consumo por equipo y turno"
      - "Detección de picos durante arranques de prensas"
      - "Seguimiento de calidad de energía para proteger electrónica sensible"

  plastica:
    title: "Soluciones para la Industria Plástica"
    paragraphs:
      - "En plantas de inyección, extrusión y termoformado, los ciclos de máquinas y el consumo de compresores son los principales factores de costo. Capturar datos operativos ayuda a reducir tiempos muertos y optimizar el uso de energía térmica y eléctrica."
      - "Diseñamos relevamientos e instalaciones de equipos de medición que se adaptan a la dinámica de inyectoras, chillers y secadoras, con soporte remoto para análisis y seguimiento."
    bullets:
      - "Monitoreo de inyectoras, extrusoras y chillers"
      - "Control de consumo de compresores y secadoras"
      - "Alertas de anomalías por ciclo o turno"

  papelera:
    title: "Soluciones para la Industria Papelera"
    paragraphs:
      - "El proceso papelero involucra pulperías, prensas, calderas, secadores y sistemas de tratamiento. El monitoreo de energía y variables operativas permite controlar eficiencia térmica, detectar fugas de vapor y planificar paradas."
      - "Asistimos a plantas cartoneras y papeleras con la instalación de medidores IoT y la integración inicial de datos hacia planillas, bases o dashboards según la infraestructura disponible."
    bullets:
      - "Medición en calderas, prensas y secadores"
      - "Seguimiento de eficiencia energética térmica"
      - "Integración de datos de producción y consumo"

  metalurgica:
    title: "Soluciones para la Industria Metalúrgica"
    paragraphs:
      - "Hornos, soldadoras, plegadoras, CNC y sistemas de tratamiento térmico definen el perfil energético de la metalurgia. Medir consumos por centro de trabajo permite ajustar tarifas, dimensionar correctamente la instalación y anticipar fallas."
      - "Realizamos relevamientos en plantas metalmecánicas para medir energía, capturar señales de producción y estructurar la información para diagnóstico y seguimiento."
    bullets:
      - "Monitoreo de hornos y máquinas herramienta"
      - "Medición de consumo por celda o línea"
      - "Análisis de factor de potencia y distorsión armónica"

localidades:
  buenos-aires:
    escobar:
      garin:
        title: "Asistencia técnica en Garín, Escobar"
        paragraphs:
          - "Garín es uno de los principales centros industriales del partido de Escobar, con acceso directo por Panamericana y Ruta 9. Desde aquí atendemos plantas del corredor productivo norte, con visitas en campo y soporte remoto según el alcance."
          - "Instalamos equipos IoT para medición de energía y captura de datos operativos en industrias gráficas, plásticas, metalúrgicas y papeleras de la zona."

      belen-de-escobar:
        title: "Asistencia técnica en Belén de Escobar"
        paragraphs:
          - "Belén de Escobar concentra actividad comercial, logística e industria de transformación en torno al centro del partido. Trabajamos con empresas de la zona que buscan digitalizar datos de energía y producción sin interrumpir la operación."
          - "Ofrecemos relevamiento en campo, instalación de medidores y asesoramiento remoto para interpretar el consumo de plantas y líneas de proceso."

      ingeniero-maschwitz:
        title: "Asistencia técnica en Ingeniero Maschwitz"
        paragraphs:
          - "Ingeniero Maschwitz combina desarrollo comercial, logístico y productivo dentro del partido de Escobar. Implementamos medidores IoT y sistemas de captura de datos en plantas que requieren flexibilidad y seguimiento remoto."
          - "Atendemos consultas de monitoreo energético, captura de variables operativas y capacitaciones técnicas de cortesía según el proyecto."

      loma-verde:
        title: "Asistencia técnica en Loma Verde"
        paragraphs:
          - "Loma Verde se ubica en el área industrial y residencial de Escobar, cerca de importantes corredores de distribución. Asistimos a industrias locales con relevamiento en campo para monitoreo de energía y variables operativas."
          - "Realizamos instalaciones de equipos IoT compatibles con tableros existentes, sin necesidad de reemplazar la instrumentación actual."

      matheu:
        title: "Asistencia técnica en Matheu"
        paragraphs:
          - "Matheu es una localidad del partido de Escobar con creciente actividad productiva vinculada al norte del GBA. Realizamos instalaciones de equipos IoT y capacitaciones técnicas de cortesía según el proyecto."
          - "Trabajamos con pymes industriales de la zona que necesitan medir energía, capturar datos de producción o iniciar un sistema de seguimiento operativo."

      maquinista-savio:
        title: "Asistencia técnica en Maquinista Savio"
        paragraphs:
