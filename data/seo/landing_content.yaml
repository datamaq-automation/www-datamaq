industrias:
  grafica:
    title: "Soluciones para la Industria Gráfica"
    paragraphs:
      - "La industria gráfica consume energía en prensas, termofijadoras, cizallas, sistemas de climatización e iluminación. Medir el consumo por máquina y turno permite identificar desperdicios, planificar mantenimiento y mejorar la cotización de trabajos."
      - "Trabajamos con talleres e imprentas para instalar medidores IoT, leer variables operativas y conectar los datos a una primera capa de visualización o reporte."
    bullets:
      - "Medición de consumo por equipo y turno"
      - "Detección de picos durante arranques de prensas"
      - "Seguimiento de calidad de energía para proteger electrónica sensible"

  plastica:
    title: "Soluciones para la Industria Plástica"
    paragraphs:
      - "En plantas de inyección, extrusión y termoformado, los ciclos de máquinas y el consumo de compresores son los principales factores de costo. Capturar datos operativos ayuda a reducir tiempos muertos y optimizar el uso de energía térmica y eléctrica."
      - "Diseñamos relevamientos e instalaciones de equipos de medición que se adaptan a la dinámica de inyectoras, chillers y secadoras, con soporte remoto para análisis y seguimiento."
    bullets:
      - "Monitoreo de inyectoras, extrusoras y chillers"
      - "Control de consumo de compresores y secadoras"
      - "Alertas de anomalías por ciclo o turno"

  papelera:
    title: "Soluciones para la Industria Papelera"
    paragraphs:
      - "El proceso papelero involucra pulperías, prensas, calderas, secadores y sistemas de tratamiento. El monitoreo de energía y variables operativas permite controlar eficiencia térmica, detectar fugas de vapor y planificar paradas."
      - "Asistimos a plantas cartoneras y papeleras con la instalación de medidores IoT y la integración inicial de datos hacia planillas, bases o dashboards según la infraestructura disponible."
    bullets:
      - "Medición en calderas, prensas y secadores"
      - "Seguimiento de eficiencia energética térmica"
      - "Integración de datos de producción y consumo"

  metalurgica:
    title: "Soluciones para la Industria Metalúrgica"
    paragraphs:
      - "Hornos, soldadoras, plegadoras, CNC y sistemas de tratamiento térmico definen el perfil energético de la metalurgia. Medir consumos por centro de trabajo permite ajustar tarifas, dimensionar correctamente la instalación y anticipar fallas."
      - "Realizamos relevamientos en plantas metalmecánicas para medir energía, capturar señales de producción y estructurar la información para diagnóstico y seguimiento."
    bullets:
      - "Monitoreo de hornos y máquinas herramienta"
      - "Medición de consumo por celda o línea"
      - "Análisis de factor de potencia y distorsión armónica"

  oil-gas:
    title: "Mantenimiento Eléctrico para Oil & Gas"
    paragraphs:
      - "Servicios de mantenimiento eléctrico industrial especializados para la industria del Oil & Gas en la Cuenca Neuquina. Experiencia en plantas de proceso continuo, yacimiento y facilities de upstream."
      - "Protocolos HSE, LOTO y normativa NFPA 70E. Cumplimiento de Res. SRT 3068/14 para trabajos con riesgo eléctrico. Facturación monotributista directa, sin intermediarios."
    bullets:
      - "Mantenimiento de celdas MT 13.2/33 kV en plantas de compresión y bombeo"
      - "Variadores de frecuencia (VFD) en bombas de extracción, inyección y transferencia"
      - "Electrógenos, UPS y sistemas de respaldo para facilities críticas"
      - "Termografía, medición de aislación y diagnóstico predictivo"
      - "Cumplimiento de Res. SRT 3068/14 para trabajos con riesgo eléctrico"

  energia:
    title: "Eficiencia Energética para el Sector Energético"
    paragraphs:
      - "Servicios de medición y consultoría en eficiencia energética para empresas del sector energético. Auditoría ISO 50001, análisis de factor de potencia y telemetría de variables operativas."
      - "Instalación de equipos IoT para monitoreo continuo de consumo, generación y calidad de energía. Integración con SCADA y sistemas de gestión energética."
    bullets:
      - "Auditoría energética ISO 50001 y análisis de curva de carga"
      - "Medición IoT de kWh, factor de potencia y distorsión armónica"
      - "Telemetría de variables operativas en tiempo real"
      - "Dashboards de monitoreo y reportes automáticos"

localidades:
  buenos-aires:
    escobar:
      garin:
        title: "Asistencia técnica en Garín, Escobar"
        paragraphs:
          - "Garín es uno de los principales centros industriales del partido de Escobar, con acceso directo por Panamericana y Ruta 9. Desde aquí atendemos plantas del corredor productivo norte, con visitas en campo y soporte remoto según el alcance."
          - "Instalamos equipos IoT para medición de energía y captura de datos operativos en industrias gráficas, plásticas, metalúrgicas y papeleras de la zona."

      belen-de-escobar:
        title: "Asistencia técnica en Belén de Escobar"
        paragraphs:
          - "Belén de Escobar concentra actividad comercial, logística e industria de transformación en torno al centro del partido. Trabajamos con empresas de la zona que buscan digitalizar datos de energía y producción sin interrumpir la operación."
          - "Ofrecemos relevamiento en campo, instalación de medidores y asesoramiento remoto para interpretar el consumo de plantas y líneas de proceso."

      ingeniero-maschwitz:
        title: "Asistencia técnica en Ingeniero Maschwitz"
        paragraphs:
          - "Ingeniero Maschwitz combina desarrollo comercial, logístico y productivo dentro del partido de Escobar. Implementamos medidores IoT y sistemas de captura de datos en plantas que requieren flexibilidad y seguimiento remoto."
          - "Atendemos consultas de monitoreo energético, captura de variables operativas y capacitaciones técnicas de cortesía según el proyecto."

      loma-verde:
        title: "Asistencia técnica en Loma Verde"
        paragraphs:
          - "Loma Verde se ubica en el área industrial y residencial de Escobar, cerca de importantes corredores de distribución. Asistimos a industrias locales con relevamiento en campo para monitoreo de energía y variables operativas."
          - "Realizamos instalaciones de equipos IoT compatibles con tableros existentes, sin necesidad de reemplazar la instrumentación actual."

      matheu:
        title: "Asistencia técnica en Matheu"
        paragraphs:
          - "Matheu es una localidad del partido de Escobar con creciente actividad productiva vinculada al norte del GBA. Realizamos instalaciones de equipos IoT y capacitaciones técnicas de cortesía según el proyecto."
          - "Trabajamos con pymes industriales de la zona que necesitan medir energía, capturar datos de producción o iniciar un sistema de seguimiento operativo."

      maquinista-savio:
        title: "Asistencia técnica en Maquinista Savio"
        paragraphs:
          - "Maquinista Savio forma parte del corredor industrial de Escobar, con buena conectividad hacia rutas principales. Atendemos consultas de monitoreo energético y captura de datos operativos con visitas técnicas programadas."
          - "Diseñamos cada intervención según el tipo de tablero, señales disponibles y objetivos de mejora de la planta."

    tigre:
      tigre:
        title: "Asistencia técnica en Tigre"
        paragraphs:
          - "Tigre es la ciudad cabecera de un partido con fuerte presencia industrial en su zona continental y logística vinculada al Delta. Brindamos asistencia técnica para monitoreo de energía e IoT industrial a empresas de la región."
          - "Combinamos visitas en campo con consultoría remota para cubrir tanto plantas industriales como emprendimientos productivos del partido."

      don-torcuato:
        title: "Asistencia técnica en Don Torcuato"
        paragraphs:
          - "Don Torcuato alberga uno de los parques industriales más importantes del partido de Tigre, conectado por Panamericana y Ruta 197. Realizamos relevamientos e instalaciones de equipos de medición en plantas de la zona."
          - "Trabajamos con industrias que buscan reducir consumos eléctricos, detectar anomalías y digitalizar información de proceso."

      el-talar:
        title: "Asistencia técnica en El Talar"
        paragraphs:
          - "El Talar es una localidad industrial clave dentro de Tigre, cercana a la Ruta 9 y al corredor de General Pacheco. Asistimos a industrias con monitoreo de energía, captura de datos y consultoría remota."
          - "Instalamos medidores IoT y desarrollamos integraciones iniciales con sistemas de terceros o planillas según la infraestructura del cliente."

      general-pacheco:
        title: "Asistencia técnica en General Pacheco"
        paragraphs:
          - "General Pacheco concentra una de las zonas industriales más activas del Gran Buenos Aires Norte, con acceso por Panamericana y Ruta 202. Atendemos plantas de diversos sectores con visitas técnicas y seguimiento remoto."
          - "Realizamos diagnósticos energéticos, medición por centro de costo y capacitaciones técnicas para equipos de mantenimiento y producción."

      benavidez:
        title: "Asistencia técnica en Benavídez"
        paragraphs:
          - "Benavídez combina actividad industrial, comercial y residencial en el partido de Tigre. Implementamos soluciones de monitoreo energético y captura de datos orientadas a pequeñas y medianas industrias."
          - "Asesoramos en la selección de equipos, la instalación en campo y la primera interpretación de los datos capturados."

      los-troncos-del-talar:
        title: "Asistencia técnica en Los Troncos del Talar"
        paragraphs:
          - "Los Troncos del Talar es una localidad en desarrollo dentro del partido de Tigre, con buena accesibilidad desde el corredor norte. Asistimos a empresas locales con relevamiento y puesta en marcha de equipos IoT."
          - "Trabajamos con flexibilidad de modalidad: visitas en campo para instalación y soporte remoto para seguimiento continuo."

      dique-lujan:
        title: "Asistencia técnica en Dique Luján"
        paragraphs:
          - "Dique Luján, junto al Delta del Paraná, alberga actividad productiva vinculada a la náutica, logística y transformación. Brindamos soporte técnico para monitoreo de energía en instalaciones de la zona."
          - "Adaptamos los equipos a condiciones particulares de conectividad y tipo de tablero, priorizando la continuidad operativa."

      rincon-de-milberg:
        title: "Asistencia técnica en Rincón de Milberg"
        paragraphs:
          - "Rincón de Milberg es una localidad del partido de Tigre con crecimiento comercial e industrial cercano a Nordelta y al acceso norte. Atendemos consultas de eficiencia energética y captura de datos operativos."
          - "Ofrecemos relevamiento, instalación de medidores y acompañamiento remoto para interpretar el comportamiento energético de cada planta."

      villa-la-nata:
        title: "Asistencia técnica en Villa La Ñata"
        paragraphs:
          - "Villa La Ñata se encuentra sobre la Ruta 27 en el partido de Tigre, con acceso directo a zonas industriales y logísticas. Realizamos visitas técnicas para medición de energía e integración de datos."
          - "Trabajamos con sectores gráfico, plástico, metalúrgico y papelero que operan en el corredor norte del GBA."

      nordelta:
        title: "Asistencia técnica en Nordelta"
        paragraphs:
          - "Nordelta es un polo urbano y comercial del partido de Tigre que también alberga servicios e industrias de apoyo. Ofrecemos asistencia remota y visitas programadas para monitoreo de energía y datos operativos."
          - "Diseñamos propuestas escalables que se ajustan al tamaño de la instalación y a los objetivos de seguimiento del cliente."

      ricardo-rojas:
        title: "Asistencia técnica en Ricardo Rojas"
        paragraphs:
          - "Ricardo Rojas es una localidad del partido de Tigre con perfil industrial y residencial en expansión. Asistimos a plantas de la zona con instalaciones de equipos IoT y capacitaciones técnicas según el proyecto."
          - "Combinamos el relevamiento en campo con el soporte remoto para que cada cliente tenga visibilidad de su consumo y sus variables críticas."

    san-pedro:
      san-pedro:
        title: "Asistencia técnica en San Pedro"
        paragraphs:
          - "San Pedro es un centro industrial y comercial del norte de la provincia de Buenos Aires, conectado por la Ruta 8 y la Ruta 191. Atendemos plantas de la zona con relevamiento en campo para monitoreo de energía e IoT industrial."
          - "Trabajamos con industrias plásticas, metalúrgicas y agroindustriales que buscan medir consumos, detectar anomalías y usar datos operativos para la toma de decisiones."

      santa-lucia:
        title: "Asistencia técnica en Santa Lucía"
        paragraphs:
          - "Santa Lucía es una localidad del partido de San Pedro con actividad industrial y residencial en crecimiento. Realizamos visitas técnicas para instalar medidores IoT y asesorar en el seguimiento de datos operativos."
          - "Diseñamos cada intervención según el tipo de tablero, equipos existentes y objetivos de mejora energética de la planta."

    neuquen:
      confluencia:
        neuquen-capital:
          title: "Mantenimiento Eléctrico Industrial en Neuquén Capital"
          paragraphs:
            - "Servicios de mantenimiento eléctrico industrial para Neuquén Capital y Parque Industrial Neuquén (PIN). Contratista especializado con disponibilidad inmediata para plantas, facilities y talleres de la zona."
            - "Experiencia en mantenimiento MT/BT, VFD, CCM, UPS y electrógenos. Facturación monotributista directa. Asistencia en campo y consultoría remota."
          bullets:
            - "Mantenimiento preventivo y correctivo en BT/MT"
            - "Tableros CCM, UPS, bancos de baterías"
            - "Consultoría en eficiencia energética ISO 50001"

        centenario:
          title: "Mantenimiento Eléctrico Industrial en Centenario"
          paragraphs:
            - "Asistencia técnica en mantenimiento eléctrico para el Parque Industrial de Centenario y zonas aledañas. Contratista con 15 años de experiencia en plantas de proceso continuo."
            - "Servicios de diagnóstico, reparación y mantenimiento preventivo en equipos MT/BT, variadores de frecuencia y sistemas de respaldo."
          bullets:
            - "Electrógenos, grupos de respaldo y sistemas de transferencia"
            - "Diagnóstico de fallas en VFD y arrancadores suaves"
            - "Medición de eficiencia energética y calidad de energía"

        plaza-huincul:
          title: "Mantenimiento Eléctrico Industrial en Plaza Huincul"
          paragraphs:
            - "Plaza Huincul, junto con Cutral Co, forma parte del núcleo de servicios de la Cuenca Neuquina. Brindamos mantenimiento eléctrico industrial a empresas de la zona con visitas programadas."
            - "Disponibilidad para asistencia en campo en talleres, plantas de servicio y facilities del corredor petrolero."
          bullets:
            - "Mantenimiento MT/BT en talleres y plantas"
            - "Diagnóstico de VFD y automatización"
            - "Medición IoT y eficiencia energética"

        cutral-co:
          title: "Mantenimiento Eléctrico Industrial en Cutral Co"
          paragraphs:
            - "Cutral Co es un centro de servicios clave para la industria del Oil & Gas en Neuquén. Ofrecemos mantenimiento eléctrico industrial con disponibilidad para la zona."
            - "Experiencia comprobable en mantenimiento de equipos MT, VFD y sistemas de respaldo. Facturación directa monotributista."
          bullets:
            - "Mantenimiento eléctrico MT/BT industrial"
            - "Variadores de frecuencia y arrancadores"
            - "Electrógenos y sistemas de respaldo"

      anelo:
        anelo:
          title: "Contratista de Mantenimiento Eléctrico en Añelo, Vaca Muerta"
          paragraphs:
            - "Contratista de mantenimiento eléctrico industrial con disponibilidad inmediata en Añelo y toda la zona de Vaca Muerta. A 15 minutos de Loma Campana, Fortín de Piedra y La Calera — los yacimientos de shale oil y tight gas más activos de la Cuenca Neuquina."
            - "Servicios especializados en MT 13.2/33 kV para celdas de distribución, CCM de bombas de extracción e inyección, VFD en equipos de lifting artificial (PCP, ESP) y sistemas de respaldo (electrógenos, UPS). Facturación monotributista directa, sin overhead de consultora. Vehículo propio 4x4."
            - "Experiencia comprobable en plantas de proceso continuo y servicios auxiliares de upstream. Protocolo LOTO documentado, cumplimiento NFPA 70E y Res. SRT 3068/14 para trabajos con riesgo eléctrico en atmósferas clasificadas."
          bullets:
            - "Mantenimiento preventivo y correctivo en celdas MT 13.2/33 kV"
            - "Diagnóstico, parametrización y puesta en marcha de VFD Siemens, Schneider y Danfoss en bombas de extracción"
            - "CCM, UPS, electrógenos y bancos de baterías para facilities críticas"
            - "Medición de aislación (megado 5 kV DC), hipot (15 kV AC) y termografía en celdas y tableros"
            - "Régimen rotativo 14x7 con pernocte en Añelo — respuesta inmediata ante paradas no programadas"
            - "Facturación directa monotributista — sin retenciones de consultora ni gastos administrativos"

        rincon-de-los-sauces:
          title: "Contratista de Mantenimiento Eléctrico en Rincón de los Sauces"
          paragraphs:
            - "Rincón de los Sauces es el punto de acceso norte a Vaca Muerta, con yacimientos de tight gas en plena expansión y facilities que operan 24/7. Brindamos servicios de mantenimiento eléctrico industrial con disponibilidad inmediata para la zona."
            - "Asistencia en campo para diagnóstico y reparación de equipos MT/BT en yacimiento: celdas de distribución 13.2/33 kV, CCM de compresores y bombas, variadores de frecuencia en sistemas de gas lift y water injection. Vehículo 4x4 propio para acceso a locaciones remotas."
            - "Protocolo LOTO en instalaciones con energía almacenada, cumplimiento de normas HSE de operadoras y Res. SRT 3068/14. Facturación monotributista directa — sin intermediarios ni costos administrativos adicionales."
          bullets:
            - "Mantenimiento correctivo y preventivo en celdas MT 13.2/33 kV y salas eléctricas de yacimiento"
            - "Diagnóstico y reparación de VFD en compresores, bombas de inyección y sistemas de gas lift"
            - "Electrógenos, UPS y sistemas de respaldo crítico en facilities aisladas de la red"
            - "Termografía infrarroja y medición de aislación en condiciones de campo"
            - "Régimen 14x7 con pernocte en Rincón de los Sauces o locación"
            - "Facturación directa monotributista — costo hora competitivo sin overhead de consultora"
