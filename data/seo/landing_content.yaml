          - "Diseñamos propuestas escalables que se ajustan al tamaño de la instalación y a los objetivos de seguimiento del cliente."

      ricardo-rojas:
        title: "Asistencia técnica en Ricardo Rojas"
        paragraphs:
          - "Ricardo Rojas es una localidad del partido de Tigre con perfil industrial y residencial en expansión. Asistimos a plantas de la zona con instalaciones de equipos IoT y capacitaciones técnicas según el proyecto."
          - "Combinamos el relevamiento en campo con el soporte remoto para que cada cliente tenga visibilidad de su consumo y sus variables críticas."

    san-pedro:
